{{- if .Capabilities.APIVersions.Has "dbaas.netcracker.com/v1" }}
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseAccessPolicy
metadata:
  name: {{ .Values.SERVICE_NAME }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: 'Cloud-Core'
    app.kubernetes.io/managed-by: 'saasDeployer'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
  operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" $.Values.API_DBAAS_ADDRESS))))) 1) | quote }}
  microserviceName: '{{ .Values.SERVICE_NAME }}'
  # The legacy DbPolicy carried disableGlobalPermissions alone, but the CRD requires at
  # least one of services or policy. site-management asks for its database with an empty
  # userRole, which the aggregator resolves through defaultRole, so a single policy entry
  # for the only database type this service uses reproduces the legacy grant.
  policy:
    - type: postgresql
      defaultRole: admin
      additionalRole: []
  disableGlobalPermissions: true
{{- else }}
apiVersion: core.netcracker.com/v1
kind: DBaaS
subKind: DbPolicy
metadata:
  name: {{ .Values.SERVICE_NAME }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    app.kubernetes.io/name: "{{ .Values.SERVICE_NAME }}"
    app.kubernetes.io/part-of: "{{ .Values.APPLICATION_NAME }}"
    app.kubernetes.io/processed-by-operator: core-operator
    deployer.cleanup/allow: "true"
    deployment.netcracker.com/sessionId: "{{ .Values.DEPLOYMENT_SESSION_ID }}"
spec:
  disableGlobalPermissions: true
{{- end }}
